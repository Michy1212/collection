            <style>
                body {
                    font-family: Arial, sans-serif;
                    max-width: 800px;

                    text-decoration: none;
                    color: inherit;
                }
                .console-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                }
                .console-img-container {
                    margin-bottom: 10px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 60px;
                }
                .console-img {
                    max-width: 100%;
                    max-height: 60px;
                    object-fit: contain;
                }

        </head>
