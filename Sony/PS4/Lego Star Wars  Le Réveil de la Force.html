
        <!DOCTYPE html>
        <html lang="fr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Lego Star Wars : Le Réveil de la Force - Détails</title>
            <style>
                /* [Le CSS existant jusqu'aux media queries reste inchangé...] */
                
                /* MEDIA QUERIES POUR MOBILE */
                @media (max-width: 768px) {
                    body {
                        padding: 10px;
                    }
                    .content-container {
                        padding: 15px;
                        border-radius: 6px;
                    }
                    h1 {
                        font-size: 1.3em;
                        margin-bottom: 15px;
                    }
                    h2 {
                        font-size: 1.1em;
                    }
                    .game-header {
                        flex-direction: column;
                        gap: 15px;
                    }
                    .game-cover {
                        width: 100%;
                        height: auto;
                        max-height: 300px;
                        margin: 0 auto;
                    }
                    .tab-buttons {
                        margin-bottom: 10px;
                    }
                    .tab-button {
                        padding: 8px 12px;
                        font-size: 0.8em;
                    }
                    
                    /* RÉDUCTION DE 25% DE LA LARGEUR DES COLONNES DU TABLEAU PRINCIPAL */
                    .info-table th {
                        width: 22.5%; /* 30% - 25% = 22.5% */
                    }
                    
                    .info-table th, .info-table td {
                        padding: 8px 6px;
                        font-size: 0.85em;
                    }
                    
                    /* RÉDUCTION DE 25% DE LA LARGEUR DES COLONNES DU TABLEAU DES DATES */
                    .dates-table {
                        font-size: 0.75em; /* Réduction supplémentaire de la police */
                        min-width: 300px; /* Largeur minimale réduite de 25% */
                    }
                    
                    .dates-table th, .dates-table td {
                        padding: 5px 4px; /* Padding réduit */
                        font-size: 0.8em;
                    }
                    
                    /* NOUVEAU : Réduction de l'espacement entre les colonnes des dates */
                    .dates-table th:nth-child(1),
                    .dates-table td:nth-child(1) {
                        padding-right: 2px;
                    }
                    .dates-table th:nth-child(2),
                    .dates-table td:nth-child(2) {
                        padding-left: 2px;
                        padding-right: 2px;
                    }
                    .dates-table th:nth-child(3),
                    .dates-table td:nth-child(3) {
                        padding-left: 2px;
                    }
                }
                
                @media (max-width: 480px) {
                    body {
                        padding: 5px;
                    }
                    .content-container {
                        padding: 10px;
                    }
                    h1 {
                        font-size: 1.2em;
                    }
                    .tab-button {
                        padding: 6px 10px;
                        font-size: 0.75em;
                    }
                    
                    /* RÉDUCTION ADDITIONNELLE POUR TRÈS PETITS ÉCRANS */
                    .info-table th {
                        width: 20%; /* Réduction supplémentaire */
                    }
                    
                    .info-table th, .info-table td {
                        padding: 6px 4px;
                        font-size: 0.8em;
                    }
                    
                    .dates-table {
                        font-size: 0.7em;
                        min-width: 280px; /* Largeur encore réduite */
                    }
                    
                    .dates-table th, .dates-table td {
                        padding: 4px 3px;
                    }
                }
                
                /* Pour les très petits écrans */
                @media (max-width: 360px) {
                    .tab-button {
                        padding: 5px 8px;
                        font-size: 0.7em;
                    }
                    
                    /* RÉDUCTION MAXIMALE POUR ÉCRANS TRÈS ÉTROITS */
                    .info-table th {
                        width: 18%; /* Largeur minimale pour rester lisible */
                    }
                    
                    .info-table th, .info-table td {
                        padding: 5px 3px;
                        font-size: 0.75em;
                    }
                    
                    .dates-table {
                        font-size: 0.65em;
                        min-width: 250px; /* Largeur minimale */
                    }
                    
                    .dates-table th, .dates-table td {
                        padding: 3px 2px;
                    }
                }
            </style>
        </head>
        <body>

        </body>
        </html>
